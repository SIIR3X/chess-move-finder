[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-move-finder"
version = "0.1.0"
description = "Real-time screen-capture chess assistant: detect the board, read pieces with an ONNX model, build a FEN, query Stockfish and overlay the best move."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lucas Fagioli", email = "lucas.fagioli576@gmail.com" }]

dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "chess>=1.10",
    # ONNX inference on the NVIDIA GPU (falls back to CPU provider if CUDA is absent).
    "onnxruntime-gpu",
    # Fast desktop-duplication capture — Windows only.
    "dxcam; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chess_move_finder"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# Third-party libraries without (complete) type stubs: treat as untyped.
[[tool.mypy.overrides]]
module = [
    "cv2", "cv2.*",
    "dxcam", "dxcam.*",
    "onnxruntime", "onnxruntime.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
