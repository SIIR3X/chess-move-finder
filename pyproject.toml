[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-move-finder"
version = "1.0.0"
description = "Chess assistant: read your chess.com game from your own Chrome over the DevTools Protocol, query Stockfish, and overlay the best move."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lucas Fagioli", email = "125802911+SIIR3X@users.noreply.github.com" }]

dependencies = [
    "pyyaml",
    "chess>=1.10",
    # CDP client: read moves straight from Chrome's game socket (no Selenium).
    "websockets>=12",
    # Transparent click-through screen overlay (best-move arrow).
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML",
    "pyinstaller>=6.0",   # packaging the Windows executable (make build)
]

[tool.hatch.build.targets.wheel]
packages = ["src/chess_move_finder"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# Third-party libraries without (complete) type stubs: treat as untyped.
[[tool.mypy.overrides]]
module = [
    "websockets", "websockets.*",
    "PySide6", "PySide6.*",
]
follow_imports = "skip"
ignore_missing_imports = true

# Qt GUI code is hard to type strictly (signals/slots, Qt subclassing); skip it.
[[tool.mypy.overrides]]
module = ["chess_move_finder.gui.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
